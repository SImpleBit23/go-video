<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action http:; base-uri 'none'; frame-ancestors 'none'">
<title>Go Video · вход VK ID</title>
<style>body{margin:0;background:#0d1117;color:#eff3f9;font:17px system-ui,sans-serif}main{max-width:560px;margin:12vh auto;padding:28px}h1{font-size:28px}p{color:#adb9ca;line-height:1.6}button{background:#2466c9;color:white;border:0;border-radius:8px;padding:16px 22px;font:inherit;cursor:pointer}.error{color:#ff8392}</style>
<main><h1>Go Video</h1><p id="message">Подготовка входа VK ID…</p><button id="continue" hidden>Продолжить вход</button></main>
<script>
// GPL-3.0-or-later. This static page exchanges no tokens with VK or a third-party server.
// Pairing data arrives only in the fragment, is kept in sessionStorage and is erased before returning to the MGU.
(function(){'use strict';
  var message=document.getElementById('message'),button=document.getElementById('continue'),key='go-video-oauth-pair';
  function fail(text){message.className='error';message.textContent=text;button.hidden=true;}
  function carUrl(value){
    var u=new URL(value),p=u.hostname.split('.').map(Number),privateIp=p.length===4&&p.every(function(n){return Number.isInteger(n)&&n>=0&&n<=255;})&&(p[0]===10||p[0]===192&&p[1]===168||p[0]===169&&p[1]===254||p[0]===172&&p[1]>=16&&p[1]<=31);
    if(u.protocol!=='http:'||!privateIp||u.port!=='8472'||u.username||u.password||u.pathname!=='/'||u.search||!/^#[0-9a-f]{32}$/.test(u.hash))throw Error('Некорректный адрес пульта MGU');
    return u;
  }
  try{
    if(location.hash.indexOf('#start=')===0){
      var start=JSON.parse(decodeURIComponent(location.hash.slice(7))),car=carUrl(start.remote),auth=new URL(start.authorize);
      if(auth.origin!=='https://id.vk.com'||auth.pathname!=='/authorize'||!auth.searchParams.get('state'))throw Error('Некорректный адрес VK ID');
      var redirect=new URL(auth.searchParams.get('redirect_uri'));
      if(redirect.origin!==location.origin||redirect.pathname!==location.pathname)throw Error('Redirect URL не совпадает со страницей входа');
      sessionStorage.setItem(key,JSON.stringify({remote:car.href,state:auth.searchParams.get('state'),at:Date.now()}));
      history.replaceState(null,'',location.pathname+location.search);
      message.textContent='Сейчас откроется официальный сайт VK. Пароль вводится только на сайте VK.';
      button.hidden=false;button.onclick=function(){location.assign(auth.href);};button.click();return;
    }
    var params=new URLSearchParams(location.search),saved=JSON.parse(sessionStorage.getItem(key)||'null');
    if(!saved&&params.get('code')&&params.get('state')&&params.get('device_id')){
      message.textContent='Скопируйте адрес этой страницы и отправьте его только через пульт Go Video, добавив перед адресом GOVK и пробел.';
      return;
    }
    if(!saved||Date.now()-saved.at>600000||params.get('state')!==saved.state||!params.get('code')||!params.get('device_id'))throw Error('Ответ VK ID не подтверждён или время входа истекло. Начните вход заново в Go Video.');
    var target=carUrl(saved.remote),callback=location.href.split('#')[0];
    sessionStorage.removeItem(key);history.replaceState(null,'',location.pathname);
    message.textContent='Вход подтверждается на MGU. Телефон должен оставаться подключённым к точке доступа машины. Если браузер спросит о переходе к устройству локальной сети, подтвердите его.';
    var form=document.createElement('form');form.method='POST';form.action=target.origin+'/api/oauth-return';
    [['token',target.hash.slice(1)],['callback',callback]].forEach(function(pair){var input=document.createElement('input');input.type='hidden';input.name=pair[0];input.value=pair[1];form.appendChild(input);});
    document.body.appendChild(form);button.hidden=false;button.textContent='Вернуться к MGU';button.onclick=function(){form.submit();};button.click();
  }catch(e){fail(e.message||'Не удалось завершить вход. Начните его заново на MGU.');}
})();
</script></html>
